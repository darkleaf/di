name: CI
on:
  push:
    branches: ['**']
    tags-ignore: ['cljdoc-*']

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: DeLaGuardo/setup-clojure@13
        with:
          cli: latest
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-
      - run: clojure -X:dev:test

  release:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: DeLaGuardo/setup-clojure@13
        with:
          cli: latest
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      - name: Generate tutorial markdown
        run: ./script/tutorial-to-md.sh

      - name: Substitute %TAG% in Readme.md
        run: sed -i "s/%TAG%/${GITHUB_REF_NAME}/g" Readme.md

      - name: Commit generated docs (detached HEAD)
        env:
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ github.actor }}
          GIT_COMMITTER_EMAIL: ${{ github.actor }}@users.noreply.github.com
        run: |
          git add -f doc/tutorial doc/how_to doc/reference
          git add Readme.md
          git commit -m "Generate cljdoc docs for ${GITHUB_REF_NAME}"

      - name: Tag and push cljdoc-${{ github.ref_name }}
        run: |
          git tag "cljdoc-${GITHUB_REF_NAME}"
          git push origin "cljdoc-${GITHUB_REF_NAME}"

      - name: Build jar
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: clojure -T:dev:build

      - name: Deploy to Clojars
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: clojure -X:dev:deploy
